baseURL = "https://applejuicemall.github.io/GY-Guide/"
locale = "zh-cn"
defaultContentLanguage = "zh-cn"
title = "广雅生存手册"
theme = "hugo-book"

[params]
  BookTheme = "auto"
  BookToC = true
  BookSearch = true
  BookSection = "docs"
  BookRepo = "https://github.com/AppleJuiceMall/GY-Guide"
  BookEditPath = "edit/preview/hugo/content"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 3
